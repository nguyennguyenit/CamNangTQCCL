name: Deploy to GitHub Pages

# Publish static site. data/*.json đã commit sẵn (build chạy local), workflow chỉ publish.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble public site
        # Chỉ publish tài sản tĩnh công khai; loại trừ source export, pipeline, plans, tests.
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js data _site/
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
