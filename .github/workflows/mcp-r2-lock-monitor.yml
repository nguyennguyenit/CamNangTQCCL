name: MCP R2 control-plane monitor

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-r2-control-plane-monitor
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: mcp-production-observe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: mcp-worker/package-lock.json
      - run: npm ci
        working-directory: mcp-worker
      - run: npm run verify:control-plane
        working-directory: mcp-worker
      - name: Verify live read-only controls
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          TQCCL_RELEASE_BUCKET_NAME: ${{ vars.TQCCL_RELEASE_BUCKET_NAME }}
          TQCCL_POINTER_BUCKET_NAME: ${{ vars.TQCCL_POINTER_BUCKET_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN }}
        run: node --import tsx scripts/verify-control-plane.ts --live
        working-directory: mcp-worker
