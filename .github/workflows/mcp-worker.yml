name: MCP worker

on:
  workflow_dispatch:
    inputs:
      production_sha:
        description: "Full 40-character main commit SHA approved for production"
        required: true
        type: string
      confirm_production:
        description: "I approve deploying this exact SHA to production"
        required: true
        type: boolean
        default: false
      bootstrap_first_release:
        description: "Tạo deployment đầu tiên khi Worker chưa có deployment"
        required: true
        type: boolean
        default: false
      rehearse_rollback:
        description: "Rollback prior, verify it, then re-promote the candidate"
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - "agent-knowledge/**"
      - ".node-version"
      - ".github/workflows/mcp-worker.yml"
      - ".github/workflows/mcp-edge-security-monitor.yml"
      - "data/**"
      - "pipeline/**"
      - "js/**"
      - "css/**"
      - "public/**"
      - "mcp-worker/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.*"
      - "scripts/**"
      - "astro.config.*"
      - "src/**"
      - "tsconfig.json"
      - "tests/**"
      - "tests-e2e/**"
      - "tests-js/**"
      - "worker/**"
      - "docs/zh-gaps.md"
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  credential-free-release-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-worker/package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: worker
      - run: npm ci
        working-directory: mcp-worker
      - run: npx playwright install --with-deps chromium
      - name: Build immutable Worker assets
        run: npm run --silent build:worker-assets > "${RUNNER_TEMP}/worker-release-evidence.json"
        working-directory: mcp-worker
      - run: npm run check:repository
        working-directory: mcp-worker
      - name: Upload Playwright failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: test-results/
      - uses: actions/upload-artifact@v7
        with:
          name: tqccl-mcp-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/worker-release-evidence.json
            mcp-worker/.worker-assets/

  production-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production == true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: tqccl-mcp-production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify manual exact-SHA approval
        shell: bash
        env:
          TQCCL_APPROVED_SHA: ${{ inputs.production_sha }}
        run: |
          [[ "$TQCCL_APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin main --no-tags
          test "$TQCCL_APPROVED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$TQCCL_APPROVED_SHA" = "$(git rev-parse origin/main)"
          if [[ "${{ inputs.bootstrap_first_release }}" == "true" ]]; then
            test "${{ inputs.rehearse_rollback }}" = "false"
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-worker/package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: worker
      - run: npm ci
        working-directory: mcp-worker
      - run: npx playwright install --with-deps chromium
      - name: Build exact-SHA Worker assets
        run: npm run --silent build:worker-assets > "${RUNNER_TEMP}/worker-release-evidence.json"
        working-directory: mcp-worker
      - name: Verify exact-SHA Worker asset evidence
        run: npm run verify:worker-assets -- "${RUNNER_TEMP}/worker-release-evidence.json"
        working-directory: mcp-worker
      - name: Run Workerd runtime gates
        run: npm run test:worker
        working-directory: mcp-worker
      - name: Run credential-free repository gate and Wrangler dry-run
        run: npm run check:repository
        working-directory: mcp-worker
      - name: Verify live edge control
        env:
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_API_TOKEN }}
        run: node --import tsx scripts/verify-control-plane.ts --live
        working-directory: mcp-worker
      - name: Preflight Worker deployment state
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TQCCL_WORKER_NAME: ${{ vars.TQCCL_WORKER_NAME }}
          TQCCL_FIRST_RELEASE_BOOTSTRAP: ${{ inputs.bootstrap_first_release }}
          TQCCL_WORKER_DEPLOY_API_TOKEN: ${{ secrets.TQCCL_WORKER_DEPLOY_API_TOKEN }}
        run: npm run preflight:worker-release
        working-directory: mcp-worker
      - name: Bootstrap first Worker version
        id: bootstrap_upload
        if: inputs.bootstrap_first_release
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.TQCCL_WORKER_DEPLOY_API_TOKEN }}
          TQCCL_MCP_BEARER_CURRENT: ${{ secrets.TQCCL_MCP_BEARER_CURRENT }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          secret_file="${RUNNER_TEMP}/mcp-first-release-secrets.env"
          cleanup() { rm -f -- "$secret_file"; }
          trap cleanup EXIT
          test -n "$TQCCL_MCP_BEARER_CURRENT"
          umask 077
          printf 'TQCCL_MCP_BEARER_CURRENT=%s\n' "$TQCCL_MCP_BEARER_CURRENT" > "$secret_file"
          npx wrangler deploy --strict --message "TQCCL MCP bootstrap $GITHUB_SHA" --secrets-file "$secret_file"
          npm run read:worker-version-upload -- "$WRANGLER_OUTPUT_FILE_PATH" deploy
        working-directory: mcp-worker
      - name: Upload immutable Worker version
        id: version_upload
        if: ${{ !inputs.bootstrap_first_release }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.TQCCL_WORKER_DEPLOY_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          npx wrangler versions upload --strict --tag "$GITHUB_SHA" --message "TQCCL MCP $GITHUB_SHA"
          npm run read:worker-version-upload -- "$WRANGLER_OUTPUT_FILE_PATH" version-upload
        working-directory: mcp-worker
      - name: Apply Worker Custom Domain
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.TQCCL_WORKER_DEPLOY_API_TOKEN }}
        run: npx wrangler triggers deploy
        working-directory: mcp-worker
      - name: Wait for Worker Custom Domain readiness
        env:
          TQCCL_MCP_ENDPOINT: ${{ vars.TQCCL_MCP_ENDPOINT }}
        run: |
          health_url="${TQCCL_MCP_ENDPOINT%/mcp}/healthz"
          deadline=$((SECONDS + 120))
          while ((SECONDS < deadline)); do
            remaining=$((deadline - SECONDS))
            request_timeout=$((remaining < 5 ? remaining : 5))
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time "$request_timeout" "$health_url" || true)"
            if [[ "$status" == "200" ]]; then
              exit 0
            fi
            remaining=$((deadline - SECONDS))
            if ((remaining > 0)); then
              sleep_for=$((remaining < 5 ? remaining : 5))
              sleep "$sleep_for"
            fi
          done
          echo "Worker Custom Domain chưa sẵn sàng sau 120 giây." >&2
          exit 1
      - name: Verify candidate, promote, and verify production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TQCCL_WORKER_NAME: ${{ vars.TQCCL_WORKER_NAME }}
          TQCCL_MCP_ENDPOINT: ${{ vars.TQCCL_MCP_ENDPOINT }}
          TQCCL_RELEASE_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
          TQCCL_FIRST_RELEASE_BOOTSTRAP: ${{ inputs.bootstrap_first_release }}
          TQCCL_REHEARSE_ROLLBACK: ${{ inputs.rehearse_rollback }}
          TQCCL_DEPLOYMENT_EVIDENCE_PATH: ${{ runner.temp }}/worker-deployment-evidence.json
          TQCCL_WORKER_DEPLOY_API_TOKEN: ${{ secrets.TQCCL_WORKER_DEPLOY_API_TOKEN }}
          TQCCL_MCP_BEARER_CURRENT: ${{ secrets.TQCCL_MCP_BEARER_CURRENT }}
        run: |
          npm run --silent release:worker -- \
            "${{ steps.bootstrap_upload.outputs.candidate_version_id || steps.version_upload.outputs.candidate_version_id }}" \
            "${RUNNER_TEMP}/worker-release-evidence.json" \
            "test/fixtures/release-verification.json"
        working-directory: mcp-worker
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tqccl-mcp-production-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/worker-release-evidence.json
            ${{ runner.temp }}/worker-deployment-evidence.json
