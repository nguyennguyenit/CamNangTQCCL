<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đội chuẩn — mobile, bộ lọc mở</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Noto+Serif+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&amp;text=%E5%85%B5&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#F3EEE3;color:#1E1B16}
a{color:#A8202A}a:hover{color:#7E1620}
</style>
</helmet>
<div style="width: 390px; height: 1240px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3EEE3; color: #1E1B16; font-family: 'Be Vietnam Pro', system-ui, sans-serif; overflow: hidden;">
  <header style="height: 60px; box-sizing: border-box; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 6px; background: #1C1A17; color: #F3EEE3;">
    <button type="button" aria-label="Mở menu trang" aria-expanded="false" style="width: 44px; height: 44px; border: none; border-radius: 10px; background: transparent; color: #F3EEE3; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg>
    </button>
    <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 5px; background: #A8202A; color: #F9F3E6; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif TC', 'Songti TC', serif; font-size: 19px; font-weight: 700; flex-shrink: 0;">兵</span>
    <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0;">
      <span style="font-family: 'Noto Serif Display', Georgia, serif; font-size: 16px; font-weight: 700;">Cẩm Nang Tam Quốc Chí</span>
      <span style="font-size: 11px; color: #B8AF9F; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Binh Diễn Xuân Thu — tham khảo</span>
    </div>
    <button type="button" aria-label="Chuyển sang giao diện tối" aria-pressed="false" style="width: 44px; height: 44px; border: none; border-radius: 10px; background: transparent; color: #F3EEE3; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
    </button>
  </header>

  <main style="flex-grow: 1; box-sizing: border-box; padding: 24px 16px 32px; display: flex; flex-direction: column; gap: 16px;">
    <h1 style="margin: 0; font-family: 'Noto Serif Display', Georgia, serif; font-size: 36px; font-weight: 700; line-height: 1.05;">Đội chuẩn</h1>

    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; background: #FFFCF5; border: 1px solid #CFC5B1; border-radius: 12px; color: #5F5A50;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
      <input type="search" aria-label="Tìm trong Đội chuẩn" placeholder="Tìm tướng, chiến pháp, binh thư…" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 15px; color: #1E1B16;">
    </label>

    <div style="display: flex; align-items: center; gap: 10px;">
      <a href="MobileList.dc.html" aria-expanded="true" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border: 1px solid #1C1A17; border-radius: 10px; background: #1C1A17; color: #F3EEE3; font-size: 14px; font-weight: 600; text-decoration: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="7" y1="12" x2="17" y2="12"></line><line x1="10" y1="17" x2="14" y2="17"></line></svg>
        Bộ lọc
        <span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #E36A6F; color: #1C1A17; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;">2</span>
      </a>
      <button type="button" style="height: 44px; padding: 0 8px; border: none; background: none; font: inherit; font-size: 14px; font-weight: 600; color: #A8202A; cursor: pointer;">Xóa lọc</button>
      <span role="status" style="margin-left: auto; font-size: 14px; color: #5F5A50;"><strong style="color: #1E1B16; font-variant-numeric: tabular-nums;">8</strong> / 25 đội</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 20px; padding: 18px 16px; background: #FFFCF5; border: 1px solid #D8CFBD; border-radius: 14px;">
      <div role="group" aria-label="Loại binh" style="display: flex; flex-direction: column; gap: 10px;">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5F5A50;">Loại binh</span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <sc-for list="{{units}}" as="o" hint-placeholder-count="4">
            <button type="button" aria-pressed="{{o.pressed}}" style="{{o.style}}">{{o.label}} <span style="font-weight: 400; opacity: 0.8;">{{o.count}}</span></button>
          </sc-for>
        </div>
      </div>

      <div role="group" aria-label="Phe" style="display: flex; flex-direction: column; gap: 10px;">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5F5A50;">Phe</span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <sc-for list="{{factions}}" as="o" hint-placeholder-count="4">
            <button type="button" aria-pressed="{{o.pressed}}" style="{{o.style}}"><span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 2px; background: {{o.color}};"></span>{{o.label}} <span style="font-weight: 400; opacity: 0.8;">{{o.count}}</span></button>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; border-top: 1px solid #E6DECF;">
        <button type="button" aria-expanded="false" style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; padding: 0; border: none; border-bottom: 1px solid #E6DECF; background: none; font: inherit; font-size: 14px; font-weight: 600; color: #5F5A50; cursor: pointer;">Nhóm
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        <button type="button" aria-expanded="false" style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; padding: 0; border: none; background: none; font: inherit; font-size: 14px; font-weight: 600; color: #5F5A50; cursor: pointer;">Nguồn
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
      </div>
    </div>

    <article style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px; background: #FFFCF5; border: 1px solid #D8CFBD; border-radius: 14px;">
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <div style="display: flex; gap: 6px;">
          <span style="display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border: 1px solid #D8CFBD; border-radius: 999px; font-size: 11.5px; font-weight: 600;"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 2px; background: #B08422;"></span>Quần</span>
          <span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; background: #EAE3D4; font-size: 11.5px; font-weight: 600; color: #3A352D;">Cung</span>
        </div>
        <a href="TeamDetailMobile.dc.html" style="font-family: 'Noto Serif Display', Georgia, serif; font-size: 21px; font-weight: 700; color: #1E1B16; text-decoration: none;">40Y Lữ Bố Cung (Vương Dị, Pháp Chính)</a>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end;">
        <span style="font-family: 'Noto Serif Display', Georgia, serif; font-size: 32px; font-weight: 700; line-height: 1; color: #A8202A;">113</span>
        <span style="margin-top: 5px; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #5F5A50;">Điểm nguồn</span>
      </div>
    </article>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    var base = 'display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ';
    var off = base + 'border: 1px solid #D8CFBD; background: #F7F2E8; color: #1E1B16;';
    var on = base + 'border: 1px solid #1C1A17; background: #1C1A17; color: #F3EEE3;';
    function chip(o) { o.pressed = o.on ? 'true' : 'false'; o.style = o.on ? on : off; return o; }
    return {
      units: [chip({ label: 'Cung', count: 14, on: true }), chip({ label: 'Kỵ', count: 5 }), chip({ label: 'Khiên', count: 4 }), chip({ label: 'Thương', count: 1 })],
      factions: [chip({ label: 'Quần', count: 9, color: '#E0B94E', on: true }), chip({ label: 'Thục', count: 5, color: '#1F7A4D' }), chip({ label: 'Ngô', count: 4, color: '#B8232C' }), chip({ label: 'Ngụy', count: 3, color: '#1F3A93' })]
    };
  }
}
</script>
</body>
</html>
