<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Hướng C — Thủy mặc</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Be+Vietnam+Pro:wght@300;400;500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600&amp;text=%E8%9C%80%E9%AD%8F%E5%90%B3%E7%BE%A4&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#FBFAF7;color:#111111}
a{color:#111111}a:hover{color:#B3261E}
</style>
</helmet>
<div style="width: 760px; height: 1080px; box-sizing: border-box; display: flex; flex-direction: column; gap: 48px; padding: 48px 56px; background: #FBFAF7; color: #111111; font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-weight: 400;">
  <header style="display: flex; justify-content: space-between; align-items: baseline;">
    <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; font-weight: 600; letter-spacing: 0.04em;">Cẩm Nang Tam Quốc</span>
    <nav aria-label="Chuyên mục" style="display: flex; gap: 22px; font-size: 14px;">
      <a href="#" aria-current="page" style="text-decoration: underline; text-underline-offset: 6px; text-decoration-color: #B3261E;">Đội chuẩn</a>
      <a href="#" style="color: #5C5C5C; text-decoration: none;">Đội khác</a>
      <a href="#" style="color: #5C5C5C; text-decoration: none;">Tra cứu</a>
      <a href="#" style="color: #5C5C5C; text-decoration: none;">Công cụ</a>
    </nav>
  </header>

  <div style="display: flex; flex-direction: column; gap: 14px;">
    <h1 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 76px; font-weight: 600; line-height: 0.95;">Đội chuẩn</h1>
    <p style="margin: 0; max-width: 460px; font-size: 15px; font-weight: 300; line-height: 1.7; color: #5C5C5C;">Tám mươi hai cấu hình giao chiến mùa Bá Vương Thảo Nghịch, giữ đúng thứ tự nguồn SGSDeck.</p>
    <label style="display: flex; align-items: center; gap: 10px; height: 48px; margin-top: 10px; border-bottom: 1px solid #111111; color: #5C5C5C;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
      <input type="search" aria-label="Tìm đội" placeholder="Tìm tướng, chiến pháp, binh thư" style="flex-grow: 1; border: none; outline: none; background: transparent; font: inherit; font-size: 16px; color: #111111;">
    </label>
  </div>

  <div style="display: flex; flex-direction: column;">
    <sc-for list="{{teams}}" as="t" hint-placeholder-count="3">
      <article style="display: grid; grid-template-columns: 88px minmax(0, 1fr) 72px; gap: 24px; align-items: start; padding: 28px 0; border-top: 1px solid #DDDAD2;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
          <span lang="zh-Hant" aria-hidden="true" style="font-family: 'Noto Serif TC', 'Songti TC', serif; font-size: 56px; font-weight: 600; line-height: 1; color: {{t.fc}};">{{t.glyph}}</span>
          <span style="font-size: 12px; color: #5C5C5C;">{{t.faction}} · {{t.unit}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 12px; min-width: 0;">
          <a href="#" style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 32px; font-weight: 600; line-height: 1.05; text-decoration: none;">{{t.name}}</a>
          <dl style="margin: 0; display: grid; grid-template-columns: 96px minmax(0, 1fr); row-gap: 6px; column-gap: 12px; font-size: 14px; line-height: 1.5;">
            <sc-for list="{{t.heroes}}" as="h" hint-placeholder-count="3">
              <dt style="font-weight: 500;">{{h.name}}</dt>
              <dd style="margin: 0; font-weight: 300; color: #3D3D3D;">{{h.tactics}}</dd>
            </sc-for>
          </dl>
          <span style="font-size: 13px; font-weight: 300; color: #5C5C5C;"><span style="color: #B3261E; font-weight: 500;">Sợ</span> — {{t.fear}}</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end;">
          <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 44px; font-weight: 700; line-height: 1;">{{t.score}}</span>
          <span style="font-size: 11px; color: #5C5C5C;">điểm nguồn</span>
        </div>
      </article>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    function heroes(list) { return list.map(function (h) { return { name: h[0], tactics: h[1] }; }); }
    return {
      teams: [
        { name: 'Tư Mã Phi Hùng', glyph: '魏', faction: 'Ngụy', fc: '#1F3A93', unit: 'Kỵ', score: 120,
          fear: 'Cung Vương Dị, Cung Cao Thuận, Thương Vinh Quang',
          heroes: heroes([['Tư Mã Ý', 'Sĩ Biệt Tam Nhật, Thượng Binh Phạt Mưu'], ['SP Tuân Úc', 'Trấn Ách Phòng Cự, Cắt Xương Trị Độc'], ['SP Tào Chân', 'Phong Thi Trận, Phi Hùng Quân']]) },
        { name: 'Thái Sư Cung', glyph: '群', faction: 'Quần', fc: '#8A6A1C', unit: 'Cung', score: 120,
          fear: 'chưa ghi trong nguồn',
          heroes: heroes([['SP Đổng Trác', 'Thuyền Cỏ Mượn Tên, Thượng Binh Phạt Mưu'], ['SP Chu Tuấn', 'Hình Nhất Trận, Cương Nhu Kết Hợp'], ['SP Điêu Thuyền', 'Hợp Quân Tụ Chúng, Đồng Lòng Hợp Sức']]) },
        { name: 'Tinh Mã Thương', glyph: '蜀', faction: 'Thục', fc: '#1F7A4D', unit: 'Thương', score: 118,
          fear: 'Sát Mã Thương, Quần Cung, Thái Bạch Kỳ Lân Cung',
          heroes: heroes([['SP Mã Siêu', 'Đương Phong Thôi Quyết, Thôi Phong Đoạn Nhẫn'], ['SP Hoàng Phổ Tung', 'Thuyền Cỏ Mượn Tên, Giải Phiền Vệ'], ['Hứa Du', 'Thác · Cách Hay Cứu Trợ, Vạn Quân Đoạt Sư']]) }
      ]
    };
  }
}
</script>
</body>
</html>
