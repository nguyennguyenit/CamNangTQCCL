<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Hướng A — Chiến báo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#0D1015;color:#E8E4DA}
a{color:#E3B955}a:hover{color:#F2D089}
</style>
</helmet>
<div style="width: 760px; height: 1080px; box-sizing: border-box; display: flex; flex-direction: column; background: #0D1015; color: #E8E4DA; font-family: 'Be Vietnam Pro', system-ui, sans-serif; background-image: linear-gradient(rgba(217,168,64,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(217,168,64,0.05) 1px, transparent 1px); background-size: 32px 32px;">
  <header style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 28px; border-bottom: 1px solid #2A3240; background: rgba(13,16,21,0.92);">
    <span style="font-family: 'Oswald', 'Arial Narrow', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #E3B955;">Cẩm Nang TQCCL</span>
    <nav aria-label="Chuyên mục" style="display: flex; gap: 4px;">
      <a href="#" aria-current="page" style="display: flex; align-items: center; height: 44px; padding: 0 12px; font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #0D1015; background: #E3B955; text-decoration: none; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);">Đội chuẩn</a>
      <a href="#" style="display: flex; align-items: center; height: 44px; padding: 0 12px; font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #B7BFCC; text-decoration: none;">Đội khác</a>
      <a href="#" style="display: flex; align-items: center; height: 44px; padding: 0 12px; font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #B7BFCC; text-decoration: none;">Tra cứu</a>
    </nav>
  </header>

  <main style="display: flex; flex-direction: column; gap: 22px; padding: 32px 28px;">
    <div style="display: flex; align-items: flex-end; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #9AA3B2;">Bá Vương Thảo Nghịch · Giao chiến</span>
        <h1 style="margin: 0; font-family: 'Oswald', sans-serif; font-size: 52px; font-weight: 700; line-height: 1; letter-spacing: 0.02em; text-transform: uppercase;">Đội chuẩn</h1>
      </div>
      <span style="font-family: 'Oswald', sans-serif; font-size: 16px; color: #9AA3B2;"><span style="color: #E3B955; font-size: 28px; font-weight: 700;">82</span> đội</span>
    </div>

    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border: 1px solid #2A3240; background: #131820; color: #9AA3B2;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
      <input type="search" aria-label="Tìm đội" placeholder="Tìm tướng, chiến pháp, binh thư…" style="flex-grow: 1; border: none; outline: none; background: transparent; font: inherit; font-size: 15px; color: #E8E4DA;">
    </label>

    <sc-for list="{{teams}}" as="t" hint-placeholder-count="2">
      <article style="display: flex; flex-direction: column; background: #151A22; border: 1px solid #2A3240; border-top: 3px solid {{t.fc}}; clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 0 100%);">
        <header style="display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 22px; border-bottom: 1px solid #242B37;">
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #B7BFCC;">{{t.faction}} · {{t.unit}}</span>
            <a href="#" style="font-family: 'Oswald', sans-serif; font-size: 28px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; color: #F4F0E6; text-decoration: none;">{{t.name}}</a>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 76px; height: 64px; border: 1px solid #E3B955; background: rgba(227,185,85,0.08);">
            <span style="font-family: 'Oswald', sans-serif; font-size: 30px; font-weight: 700; line-height: 1; color: #E3B955;">{{t.score}}</span>
            <span style="font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #C9B27A;">Điểm</span>
          </div>
        </header>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));">
          <sc-for list="{{t.heroes}}" as="h" hint-placeholder-count="3">
            <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; border-right: 1px solid #242B37;">
              <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #9AA3B2;">{{h.role}}</span>
              <span style="font-size: 16px; font-weight: 600; color: #F4F0E6;">{{h.name}}</span>
              <div style="display: flex; flex-direction: column; gap: 6px;">
                <sc-for list="{{h.tactics}}" as="tc" hint-placeholder-count="2">
                  <button type="button" style="min-height: 30px; padding: 4px 8px; border: 1px solid #5A4A22; background: rgba(227,185,85,0.06); color: #EBCB7C; font: inherit; font-size: 12.5px; text-align: left; cursor: pointer;">{{tc}}</button>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>
        <footer style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 22px; border-top: 1px solid #242B37;">
          <span style="font-size: 13px; color: #B7BFCC;"><span style="color: #E0555D; font-weight: 600;">Sợ</span> · {{t.fear}}</span>
          <a href="#" style="font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none;">Chi tiết →</a>
        </footer>
      </article>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      teams: [
        { name: 'Tinh Mã Thương', faction: 'Thục', fc: '#5FCE95', unit: 'Thương', score: 118,
          fear: 'Sát Mã Thương, Quần Cung, Thái Bạch Kỳ Lân Cung',
          heroes: [
            { role: 'Chủ tướng', name: 'SP Mã Siêu', tactics: ['Đương Phong Thôi Quyết', 'Thôi Phong Đoạn Nhẫn'] },
            { role: 'Phó 1', name: 'SP Hoàng Phổ Tung', tactics: ['Thuyền Cỏ Mượn Tên', 'Giải Phiền Vệ'] },
            { role: 'Phó 2', name: 'Hứa Du', tactics: ['Thác · Cách Hay Cứu Trợ', 'Vạn Quân Đoạt Sư'] }
          ] },
        { name: 'Tư Mã Phi Hùng', faction: 'Ngụy', fc: '#4F74D6', unit: 'Kỵ', score: 120,
          fear: 'Cung Vương Dị, Cung Cao Thuận, Thương Vinh Quang',
          heroes: [
            { role: 'Chủ tướng', name: 'Tư Mã Ý', tactics: ['Sĩ Biệt Tam Nhật', 'Thượng Binh Phạt Mưu'] },
            { role: 'Phó 1', name: 'SP Tuân Úc', tactics: ['Trấn Ách Phòng Cự', 'Cắt Xương Trị Độc'] },
            { role: 'Phó 2', name: 'SP Tào Chân', tactics: ['Phong Thi Trận', 'Phi Hùng Quân'] }
          ] }
      ]
    };
  }
}
</script>
</body>
</html>
