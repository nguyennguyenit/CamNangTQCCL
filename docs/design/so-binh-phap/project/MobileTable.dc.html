<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đội chuẩn — mobile, dạng bảng</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Noto+Serif+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&amp;text=%E5%85%B5&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#F3EEE3;color:#1E1B16}
a{color:#A8202A}a:hover{color:#7E1620}
</style>
</helmet>
<div style="width: 390px; height: 1760px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3EEE3; color: #1E1B16; font-family: 'Be Vietnam Pro', system-ui, sans-serif; overflow: hidden;">
  <header style="height: 60px; box-sizing: border-box; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 6px; background: #1C1A17; color: #F3EEE3;">
    <button type="button" aria-label="Mở menu trang" aria-expanded="false" style="width: 44px; height: 44px; border: none; border-radius: 10px; background: transparent; color: #F3EEE3; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg>
    </button>
    <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 5px; background: #A8202A; color: #F9F3E6; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif TC', 'Songti TC', serif; font-size: 19px; font-weight: 700; flex-shrink: 0;">兵</span>
    <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0;">
      <span style="font-family: 'Noto Serif Display', Georgia, serif; font-size: 16px; font-weight: 700;">Cẩm Nang Tam Quốc Chí</span>
      <span style="font-size: 11px; color: #B8AF9F; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Binh Diễn Xuân Thu — tham khảo</span>
    </div>
    <button type="button" aria-label="Chuyển sang giao diện tối" aria-pressed="false" style="width: 44px; height: 44px; border: none; border-radius: 10px; background: transparent; color: #F3EEE3; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
    </button>
  </header>

  <main style="flex-grow: 1; box-sizing: border-box; padding: 24px 16px 32px; display: flex; flex-direction: column; gap: 20px;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #A8202A;">Đội hình</span>
      <h1 style="margin: 0; font-family: 'Noto Serif Display', Georgia, serif; font-size: 36px; font-weight: 700; line-height: 1.05;">Đội chuẩn</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.55; color: #5F5A50;">Cấu hình tham khảo từ SGSDeck, giữ đúng thứ tự nguồn.</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #5F5A50;">Mùa nguồn
        <select style="height: 44px; width: 100%; padding: 0 10px; border: 1px solid #CFC5B1; border-radius: 10px; background: #FFFCF5; color: #1E1B16; font: inherit; font-size: 14px; font-weight: 500;"><option>OG · Binh Diễn Xuân Thu</option></select>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #5F5A50;">Danh mục
        <select style="height: 44px; width: 100%; padding: 0 10px; border: 1px solid #CFC5B1; border-radius: 10px; background: #FFFCF5; color: #1E1B16; font: inherit; font-size: 14px; font-weight: 500;"><option>Giao chiến</option></select>
      </label>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; background: #FFFCF5; border: 1px solid #CFC5B1; border-radius: 12px; color: #5F5A50;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
        <input type="search" aria-label="Tìm trong Đội chuẩn" placeholder="Tìm tướng, chiến pháp, binh thư…" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 15px; color: #1E1B16;">
      </label>
      <div style="display: flex; align-items: center; gap: 10px;">
        <a href="MobileFilters.dc.html" aria-expanded="false" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border: 1px solid #CFC5B1; border-radius: 10px; background: #FFFCF5; color: #1E1B16; font-size: 14px; font-weight: 600; text-decoration: none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="7" y1="12" x2="17" y2="12"></line><line x1="10" y1="17" x2="14" y2="17"></line></svg>
          Bộ lọc
        </a>
        <span role="status" style="margin-left: auto; font-size: 14px; color: #5F5A50;"><strong style="color: #1E1B16; font-variant-numeric: tabular-nums;">25</strong> / 25 đội</span>
        <div role="group" aria-label="Kiểu hiển thị" style="display: flex; gap: 2px; padding: 3px; border: 1px solid #CFC5B1; border-radius: 11px; background: #FFFCF5;">
          <a href="MobileList.dc.html" aria-label="Xem dạng thẻ" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 38px; border-radius: 8px; background: transparent; color: #3A352D;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"></rect><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"></rect><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"></rect><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"></rect></svg></a>
          <a href="MobileTable.dc.html" aria-label="Xem dạng bảng" aria-current="true" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 38px; border-radius: 8px; background: #1C1A17; color: #F3EEE3;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></a>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; background: #FFFCF5; border: 1px solid #D8CFBD; border-radius: 14px; overflow: hidden;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
        <a href="TeamDetailMobile.dc.html" style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 14px; border-top: {{r.border}}; color: #1E1B16; text-decoration: none;">
          <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
            <span style="font-family: 'Noto Serif Display', Georgia, serif; font-size: 16.5px; font-weight: 700; line-height: 1.25;">{{r.name}}</span>
            <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5F5A50;"><sc-if value="{{r.hasFaction}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 2px; background: {{r.fc}};"></span><span style="font-weight: 600; color: #3A352D;">{{r.faction}}</span></sc-if>{{r.unitText}}</span>
            <span style="font-size: 12.5px; line-height: 1.4; color: #5F5A50;">{{r.lineup}}</span>
          </span>
          <span style="font-family: 'Noto Serif Display', Georgia, serif; font-size: 22px; font-weight: 700; line-height: 1.1; color: #A8202A; font-variant-numeric: tabular-nums;">{{r.score}}</span>
        </a>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1760}}'>
class Component extends DCLogic {
  renderVals() {
    var FC = { 'Ngụy': '#1F3A93', 'Thục': '#1F7A4D', 'Ngô': '#B8232C', 'Quần': '#B08422' };
    var SHORT = { 'Chủ tướng': 'Chủ', 'Phó 1': 'Phó 1', 'Phó 2': 'Phó 2' };
    function team(r, i) {
      var t = { name: r[0], faction: r[1], unit: r[2], score: r[3], alts: r[4] };
      t.hasFaction = !!t.faction;
      t.fc = FC[t.faction] || 'transparent';
      t.unitText = (t.faction && t.unit ? '· ' : '') + (t.unit || '');
      t.fear = []; t.hasFear = false; t.fearLabel = 'Sợ'; t.fearText = '';
      t.hasAlts = t.alts > 0;
      t.bg = i % 2 ? '#FBF7EE' : '#FFFCF5';
      t.border = i ? '1px solid #E6DECF' : 'none';
      t.heroes = r[5].map(function (h, j) {
        return { role: h[0], short: SHORT[h[0]] || h[0], name: h[1], tactics: h[2],
          booksText: h[3] || 'Nguồn chưa ghi', booksStyle: h[3] ? 'normal' : 'italic', sep: j ? '1px dashed #E6DECF' : 'none' };
      });
      t.lineup = t.heroes.map(function (h) { return h.name; }).join(' · ');
      return t;
    }
    var RAW = [["40Y Lữ Bố Cung (Vương Dị, Pháp Chính)", "Quần", "Cung", 113, 0, [["Chủ tướng", "40Y Lữ Bố", ["Dẫn Huyền Lực Chiến", "Huyết Đao Tranh Giành"], "Dĩ Trực Báo Oán · Tinh Chuẩn · Trì Trọng"], ["Phó 1", "Vương Dị", ["Đoạt Hồn Hiệp Phách", "Đương Phong Thôi Quyết"], "Kỳ Chính Tương Sinh · Văn Thao · Giấu Đao"], ["Phó 2", "SP Pháp Chính", ["Tam Thế Trận", "Lâm Nguy Cứu Chủ"], "Tam Quân Chi Chúng · Rèn Luyện · Dẫn Quân"]]], ["40Y Lữ Bố Cung (Tinh·Tiên Đăng Tử Sĩ)", "Quần", "Cung", 113, 0, [["Chủ tướng", "40Y Lữ Bố", ["Huyết Đao Tranh Giành", "Dẫn Huyền Lực Chiến"], "Thắng Sẽ Càng Mạnh · Võ Lược · Cầm Binh Khí"], ["Phó 1", "SP Lư Thực", ["Nhạn Hành Trận", "Tử Sĩ Tiên Phong"], "Tam Quân Chi Chúng · Chiến Đấu Trường Kỳ · Dẫn Quân"], ["Phó 2", "SP Điêu Thuyền", ["Thâm Tàng Nhược Hư", "Cương Nhu Kết Hợp"], "Tam Quân Chi Chúng · Chiến Đấu Trường Kỳ · Dẫn Quân"]]], ["40Y Lữ Bố Cung (Đổng Trác, Điêu Thuyền)", "Quần", "Cung", 113, 0, [["Chủ tướng", "40Y Lữ Bố", ["Huyết Đao Tranh Giành", "Dẫn Huyền Lực Chiến"], "Thắng Sẽ Càng Mạnh · Võ Lược · Cầm Binh Khí"], ["Phó 1", "SP Điêu Thuyền", ["Thâm Tàng Nhược Hư", "Cương Nhu Kết Hợp"], "Tam Quân Chi Chúng · Chiến Đấu Trường Kỳ · Dẫn Quân"], ["Phó 2", "SP Đổng Trác", ["Nhạn Hành Trận", "Tử Sĩ Tiên Phong"], "Tam Quân Chi Chúng · Chiến Đấu Trường Kỳ · Dẫn Quân"]]], ["40Y Lữ Bố Cung (Điêu Thuyền, Lư Thực)", "Quần", "Cung", 113, 0, [["Chủ tướng", "40Y Lữ Bố", ["Huyết Đao Tranh Giành", "Dẫn Huyền Lực Chiến"], "Thắng Sẽ Càng Mạnh · Võ Lược · Cầm Binh Khí"], ["Phó 1", "SP Điêu Thuyền", ["Thâm Tàng Nhược Hư", "Cương Nhu Kết Hợp"], "Tam Quân Chi Chúng · Dẫn Quân · Chiến Đấu Trường Kỳ"], ["Phó 2", "SP Lư Thực", ["Nhạn Hành Trận", "Tử Sĩ Tiên Phong"], "Tam Quân Chi Chúng · Dẫn Quân · Chiến Đấu Trường Kỳ"]]], ["Ngũ Mưu Cung (chuyển · Bạch Nhĩ Binh)", "Ngụy", "Cung", 113, 0, [["Chủ tướng", "SP Tuân Úc", ["Bạch Nhị Binh", "Cắt Xương Trị Độc"], "Tam Quân Chi Chúng · Dẫn Quân · Rèn Luyện"], ["Phó 1", "SP Quách Gia", ["Đoạt Hồn Hiệp Phách", "Đương Phong Thôi Quyết"], "Kỳ Chính Tương Sinh · Giấu Đao · Văn Thao"], ["Phó 2", "Giả Hủ", ["Nhanh Trí Động Não", "Thượng Binh Phạt Mưu"], "Tam Quân Chi Chúng · Dẫn Quân · Rèn Luyện"]]], ["Ngô Nữ Kỵ (Tinh·Hổ Báo Kỵ)", "Ngô", "Kỵ", 113, 0, [["Chủ tướng", "CO Vô Song Đại Kiều", ["Mê Hoặc", "Thuyền Cỏ Mượn Tên"], "Nhìn Rõ Mồn Một · Rèn Luyện · Dẫn Quân"], ["Phó 1", "Tôn Thượng Hương", ["Đương Phong Thôi Quyết", "Mau Giành Lợi Thế"], "Thắng Sẽ Càng Mạnh · Thắng Trận · Giấu Đao"], ["Phó 2", "CO Vô Song Tiểu Kiều", ["Lâm Nguy Cứu Chủ", "Hổ Báo Kỵ"], "Chẩm Qua Tọa Giáp · Rèn Luyện · Dẫn Quân"]]], ["Thái Sư Cung（chuyển·Phi Hùng Quân）", "Quần", "Cung", 113, 0, [["Chủ tướng", "SP Đổng Trác", ["Phi Hùng Quân", "Thượng Binh Phạt Mưu"], "Tam Quân Chi Chúng · Chiến Đấu Trường Kỳ · Dẫn Quân"], ["Phó 1", "SP Lư Thực", ["Nhạn Hành Trận", "Cương Nhu Kết Hợp"], "Tam Quân Chi Chúng · Chiến Đấu Trường Kỳ · Dẫn Quân"], ["Phó 2", "SP Điêu Thuyền", ["Thâm Tàng Nhược Hư", "Đồng Lòng Hợp Sức"], "Tam Quân Chi Chúng · Chiến Đấu Trường Kỳ · Dẫn Quân"]]], ["Trương Phi Hạch Đạn Cung (Tinh·Vô Đương Phi Quân)", "Thục", "Cung", 113, 0, [["Chủ tướng", "Chu Thái", ["Tiềm Long Trận", "Thịnh Khí Linh Địch"], "Biết Cách Phòng Thủ · Thế Phòng Thủ · Phòng Bị"], ["Phó 1", "Trương Phi", ["Gió Táp Mưa Sa", "Cương Dũng Vô Tiền"], "Dĩ Trực Báo Oán · Tinh Chuẩn · Trì Trọng"], ["Phó 2", "SP Chu Tuấn", ["Vô Đương Phi Quân", "Thái Bình Đạo Pháp"], "Dĩ Trực Báo Oán · Tinh Chuẩn · Trì Trọng"]]], ["Pháp Quan Thuẫn (Tinh·Binh Đằng Giáp)", "Thục", "Khiên", 113, 0, [["Chủ tướng", "SP Quan Vũ", ["Lấy Ít Đánh Nhiều", "Gió Táp Mưa Sa"], "Chia Nhỏ Đánh Nhanh · Bách Chiến · Khép Hờ"], ["Phó 1", "Mã Đại", ["Ngư Lân Trận", "Lính Giáp Mây"], "Tam Quân Chi Chúng · Rèn Luyện · Dẫn Quân"], ["Phó 2", "SP Pháp Chính", ["Dưỡng Sức Đợi Chiến", "Không Đánh Mà Thắng"], "Tam Quân Chi Chúng · Rèn Luyện · Dẫn Quân"]]], ["Hoàng Mã Thương (Tinh·Giải Phiền Vệ)", null, "Thương", 113, 0, [["Chủ tướng", "SP Mã Siêu", ["Đương Phong Thôi Quyết", "Thôi Phong Đoạn Nhẫn"], "Tấn Công Điểm Yếu · Tốc Chiến · Khép Hờ"], ["Phó 1", "SP Hoàng Phổ Tung", ["Thuyền Cỏ Mượn Tên", "Vạn Quân Đoạt Sư"], "Đánh Giá Tình Hình · Chia lời"], ["Phó 2", "Hứa Du", ["Lâm Nguy Cứu Chủ", "Giải Phiền Vệ"], "Yêu Lính Thương Dân · Thế Phòng Thủ · Phòng Bị"]]], ["Đổng Trác Cung (Tinh·Tiên Đăng Tử Sĩ)", "Quần", "Cung", 113, 0, [["Chủ tướng", "40Y Lữ Bố", ["Huyết Đao Tranh Giành", "Dẫn Huyền Lực Chiến"], "Thắng Sẽ Càng Mạnh · Võ Lược · Cầm Binh Khí"], ["Phó 1", "SP Điêu Thuyền", ["Thâm Tàng Nhược Hư", "Cương Nhu Kết Hợp"], "Tam Quân Chi Chúng · Chiến Đấu Trường Kỳ · Dẫn Quân"], ["Phó 2", "SP Đổng Trác", ["Nhạn Hành Trận", "Tử Sĩ Tiên Phong"], "Tam Quân Chi Chúng · Chiến Đấu Trường Kỳ · Dẫn Quân"]]], ["Hứa Du Mã Siêu Kỵ", "Ngụy", "Kỵ", 113, 0, [["Chủ tướng", "CO Vô Song Đại Kiều", ["Tiềm Long Trận", "Độc Hành Phó Đấu"], "Tam Quân Chi Chúng · Rèn Luyện · Dẫn Quân"], ["Phó 1", "Hứa Du", ["Lâm Nguy Cứu Chủ", "Hổ Báo Kỵ"], "Tam Quân Chi Chúng · Rèn Luyện · Dẫn Quân"], ["Phó 2", "SP Mã Siêu", ["Đương Phong Thôi Quyết", "Thôi Phong Đoạn Nhẫn"], "Tấn Công Điểm Yếu · Tốc Chiến · Khép Hờ"]]]];
    return { rows: RAW.map(team) };
  }
}
</script>
</body>
</html>
