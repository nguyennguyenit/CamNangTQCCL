# Cloudflare Worker proxy Vision LLM. Hạ tầng TÁCH BIỆT site (không deploy lên Pages).
# Secrets đặt qua `wrangler secret put` — KHÔNG ghi ở đây.
name = "tqccl-vision-proxy"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# KV cho rate-limit + đếm cap. Tạo: `wrangler kv namespace create RL`
# rồi dán id thật vào đây.
[[kv_namespaces]]
binding = "RL"
id = "6fff7d73c885457dbb71756de99e66fa"

[vars]
# Domain site (CORS) — Cloudflare Pages (repo private nên không dùng GitHub Pages).
ALLOWED_ORIGIN = "https://tqccl.pages.dev"
# Qwen DashScope — chọn region: "intl" (Singapore, có free tier) | "cn" (mainland).
# Key của user là 百炼/bailian (CN mainland) -> REGION="cn".
# Để trống MODEL_ENDPOINT để dùng REGION; hoặc set MODEL_ENDPOINT để override hẳn.
REGION = "cn"
# Base URL theo console của user (coding-intl) — override hẳn REGION.
MODEL_ENDPOINT = "https://coding-intl.dashscope.aliyuncs.com/v1/chat/completions"
MODEL_ID = "qwen3.7-plus"
FEATURE_ENABLED = "true"
# Placeholder — chốt theo free tier thực (L2).
RL_PER_HOUR = "10"
DAILY_CAP = "500"
MONTHLY_CAP = "8000"
MAX_IMAGE_BYTES = "1500000"
